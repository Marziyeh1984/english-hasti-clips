<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">English learning classroom</title>
  <desc id="desc">A modern illustration of a young teacher writing English words on a chalkboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e9e9"/><stop offset="1" stop-color="#e9d7d7"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243332"/><stop offset="1" stop-color="#101918"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="160" r="210" fill="#fff" opacity=".34"/>
  <rect x="150" y="120" width="1300" height="650" rx="38" fill="url(#board)" filter="url(#shadow)"/>
  <rect x="185" y="155" width="1230" height="580" rx="24" fill="none" stroke="#b8aaa0" stroke-width="10" opacity=".7"/>
  <g fill="#f8f4e8" font-family="Georgia,serif" font-weight="700">
