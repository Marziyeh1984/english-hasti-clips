    <path d="M120 270 C95 205 120 130 190 115 C260 130 278 205 245 275 C210 250 160 250 120 270Z" fill="#4b302d"/>
    <circle cx="190" cy="190" r="66" fill="#e8c9ba"/>
    <path d="M130 175 C145 125 225 115 258 170 C232 153 195 148 155 165Z" fill="#4b302d"/>
    <circle cx="168" cy="194" r="6" fill="#34231f"/><circle cx="213" cy="194" r="6" fill="#34231f"/>
    <path d="M174 225 Q190 235 206 225" fill="none" stroke="#8d5149" stroke-width="5" stroke-linecap="round"/>
    <path d="M95 300 L20 400 L75 425 L150 340Z" fill="#d9a9a6"/>
